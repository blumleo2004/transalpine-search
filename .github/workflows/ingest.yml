name: Daily Podcast Ingestion & Keep-Alive

on:
  schedule:
    # Every day at 6:00 AM UTC to check for updates and keep the database active
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual run from GitHub actions UI

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Ingestion Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          RSS_FEED_URL: ${{ secrets.RSS_FEED_URL }}
        run: npx tsx scripts/ingest.ts
